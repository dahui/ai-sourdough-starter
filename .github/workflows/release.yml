name: release

on:
  push:
    tags:
      - 'v*.*.*'

# Why no conventional-changelog step: TriPSs/conventional-changelog-action
# runs `git pull --tags --ff-only` at startup, which refuses on tag-push
# events because the local tag would be "clobbered" by the remote tag of
# the same name. softprops/action-gh-release with generate_release_notes
# uses GitHub's native API and works correctly when triggered by a tag
# push. See plans/fix-release-workflow-tag-conflict.md.

permissions:
  contents: write

jobs:
  release:
    name: tag-based release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
