name: test-rendering

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  render-go:
    name: render go and run its CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install copier
        run: pip install copier==9.15.1

      - name: render
        run: |
          mkdir -p /tmp/render
          copier copy --trust --defaults \
            --data project_name='Demo Project' \
            --data project_slug='demo-project' \
            --data module_path='github.com/test/demo-project' \
            profiles/go /tmp/render/go

      - name: verify executables
        run: |
          cd /tmp/render/go
          for f in .claude/hooks/*.sh scripts/*.sh; do
            test -x "$f" || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: build and test
        working-directory: /tmp/render/go
        run: |
          go mod tidy
          go vet ./...
          go test -race -coverprofile=cover.out ./...
          ./scripts/check-coverage.sh cover.out 85
          go build ./...

      - name: govulncheck
        working-directory: /tmp/render/go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  render-java:
    name: render java and run its CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install copier
        run: pip install copier==9.15.1

      - name: render
        run: |
          mkdir -p /tmp/render
          copier copy --trust --defaults \
            --data project_name='Demo Service' \
            --data project_slug='demo-service' \
            --data java_group_id='com.example' \
            --data java_package='com.example.demoservice' \
            profiles/java /tmp/render/java

      - name: verify executables
        run: |
          cd /tmp/render/java
          for f in .claude/hooks/*.sh; do
            test -x "$f" || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        working-directory: /tmp/render/java
        run: mvn -B verify

  render-nodejs-ts:
    name: render nodejs-ts and run its CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install copier
        run: pip install copier==9.15.1

      - name: render
        run: |
          mkdir -p /tmp/render
          copier copy --trust --defaults \
            --data project_name='Demo Service' \
            --data project_slug='demo-service' \
            profiles/nodejs-ts /tmp/render/ts

      - name: verify executables
        run: |
          cd /tmp/render/ts
          for f in .claude/hooks/*.sh; do
            test -x "$f" || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done

      - uses: pnpm/action-setup@v4
        with:
          version: '9.11.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install + ship-check
        working-directory: /tmp/render/ts
        run: |
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm coverage
          pnpm build

  render-python:
    name: render python and run its CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install copier
        run: pip install copier==9.15.1

      - name: render
        run: |
          mkdir -p /tmp/render
          copier copy --trust --defaults \
            --data project_name='Demo Service' \
            --data project_slug='demo-service' \
            --data python_module='demo_service' \
            profiles/python /tmp/render/python

      - name: verify executables
        run: |
          cd /tmp/render/python
          for f in .claude/hooks/*.sh; do
            test -x "$f" || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: lock, install, test
        working-directory: /tmp/render/python
        run: |
          uv python install 3.12
          uv lock
          uv sync --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  starter-self-checks:
    name: starter self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify sync-commands produces no drift
        run: |
          bin/sync-commands
          # Filter ?? (untracked) entries — only modifications of tracked
          # files count as drift.
          DRIFT=$(git status --porcelain .claude/commands .clinerules/workflows | grep -v '^??' || true)
          if [ -n "$DRIFT" ]; then
            echo "FAIL: sync-commands changed tracked files. Commit the synced output."
            git diff
            exit 1
          fi

      - name: verify sync-profiles produces no drift
        run: bin/sync-profiles --check

      - name: verify hook scripts have executable bit
        run: |
          for f in .claude/hooks/*.sh bin/*; do
            test -x "$f" || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done

      - name: verify AGENTS.md exists and CLAUDE.md imports it
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          grep -qE '^@AGENTS\.md' CLAUDE.md

      - name: run doctor
        run: bin/doctor
