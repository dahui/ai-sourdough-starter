# golangci-lint v2 configuration
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  go: "{{ go_version }}"
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - copyloopvar
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      excludes:
        # Allow file inclusion via variable in tests
        - G304
    revive:
      severity: error
      rules:
        - name: var-naming
        - name: exported
        - name: error-return
        - name: error-strings
        - name: unexported-return
        - name: package-comments
        - name: indent-error-flow
        - name: superfluous-else
        - name: redefines-builtin-id

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - "{{ module_path }}"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
