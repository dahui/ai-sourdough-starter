version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

# Profile-specific package-ecosystem entries are appended by the active
# profile's copier render. See profiles/<lang>/{{ project_slug }}/.github/dependabot.yml
