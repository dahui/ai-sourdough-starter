[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "{{ project_description }}"
readme = "README.md"
requires-python = ">={{ python_version }}"
license = { text = "{{ license }}" }
authors = [
    { name = "{{ copyright_holder }}" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: {{ python_version }}",
]
dependencies = []

[project.scripts]
{{ python_module }} = "{{ python_module }}.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ python_module }}"]

# ----- Tooling -----

[tool.ruff]
target-version = "py{% if python_version == '3.12' %}312{% else %}313{% endif %}"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # flake8-builtins
    "C4",           # comprehensions
    "SIM",          # simplifications
    "TCH",          # type-checking blocks
    "PL",           # pylint
    "RUF",          # ruff-specific
    "S",            # bandit (security)
    "PERF",         # perf
]
ignore = [
    "PLR0913",     # too many arguments — too noisy for an opinion
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S106"]   # asserts and magic values OK in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "{{ python_version }}"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov={{ python_module }}",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["src/{{ python_module }}"]
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pip-audit>=2.7.3",
]
