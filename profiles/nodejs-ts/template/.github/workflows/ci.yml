name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: lint · typecheck · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '{{ pnpm_version }}'

      - name: set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '{{ node_version }}'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: format check
        run: pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      - name: test + coverage gate
        run: pnpm coverage

      - name: build
        run: pnpm build

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '{{ pnpm_version }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '{{ node_version }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high --prod
